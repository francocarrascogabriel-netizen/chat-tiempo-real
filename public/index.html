<!DOCTYPE html>

<!-- Indicamos que el contenido de la página está en español -->
<html lang="es">

<head>

    <!-- Permite utilizar correctamente caracteres como ñ, á, é, etc. -->
    <meta charset="UTF-8">

    <!-- Hace que la página se adapte correctamente a distintos tamaños de pantalla -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título que aparece en la pestaña del navegador -->
    <title>Chat en tiempo real</title>

    <!--
        Bootstrap 5.
        Lo utilizamos para formularios, botones, tarjetas,
        columnas y otros elementos visuales.
    -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Hoja de estilos propia del proyecto -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Contenedor principal de toda la aplicación -->
    <main class="container py-5">


        <!-- ===================================================== -->
        <!-- PANTALLA DE INGRESO                                   -->
        <!-- ===================================================== -->

        <!--
            Esta es la primera pantalla que ve el usuario.
            Debe ingresar un nombre antes de acceder al chat.
        -->
        <section id="pantallaIngreso">

            <div class="row justify-content-center">

                <div class="col-md-6 col-lg-5">

                    <div class="card shadow">

                        <div class="card-body p-4">

                            <!-- Título principal -->
                            <h1 class="text-center mb-3">
                                Chat en tiempo real
                            </h1>

                            <!-- Texto explicativo -->
                            <p class="text-center text-secondary">
                                Ingresá tu nombre para entrar al chat.
                            </p>


                            <!--
                                Formulario de ingreso.
                                JavaScript evita que recargue la página
                                y envía el nombre al servidor.
                            -->
                            <form id="formIngreso">

                                <!-- Etiqueta del campo de usuario -->
                                <label
                                    for="nombreUsuario"
                                    class="form-label"
                                >
                                    Nombre de usuario
                                </label>


                                <!-- Campo donde se escribe el nombre -->
                                <input
                                    type="text"
                                    id="nombreUsuario"
                                    class="form-control"
                                    maxlength="30"
                                    autocomplete="off"
                                    placeholder="Ejemplo: Franco"
                                    required
                                >


                                <!-- Botón para entrar al chat -->
                                <button
                                    type="submit"
                                    class="btn btn-primary w-100 mt-3"
                                >
                                    Entrar al chat
                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </section>



        <!-- ===================================================== -->
        <!-- PANTALLA PRINCIPAL DEL CHAT                           -->
        <!-- ===================================================== -->

        <!--
            Comienza oculta utilizando d-none.

            JavaScript la mostrará cuando el servidor
            confirme que el usuario quedó registrado.
        -->
        <section id="pantallaChat" class="d-none">


            <!-- ================================================= -->
            <!-- ENCABEZADO DEL CHAT                               -->
            <!-- ================================================= -->

            <!--
                Mostramos:
                - nombre del usuario actual;
                - ID parcial;
                - estado de conexión;
                - cantidad de usuarios conectados.
            -->
            <div class="chat-header mb-3">

                <!-- Información del usuario actual -->
                <div>

                    <h2 class="mb-1">
                        Chat en tiempo real
                    </h2>

                    <p class="mb-1">
                        Usuario actual:
                        <strong id="usuarioActual">---</strong>
                    </p>


                    <!--
                        JavaScript cambia este indicador
                        cuando Socket.IO conecta o desconecta.
                    -->
                    <span
                        id="estadoConexion"
                        class="badge text-bg-success"
                    >
                        Conectado
                    </span>

                </div>


                <!-- Cantidad total de usuarios conectados -->
                <div class="text-end">

                    <span class="text-secondary">
                        Usuarios conectados
                    </span>

                    <div
                        id="contadorUsuarios"
                        class="fs-4 fw-bold"
                    >
                        0
                    </div>

                </div>

            </div>



            <!-- ================================================= -->
            <!-- CUERPO PRINCIPAL                                  -->
            <!-- ================================================= -->

            <div class="row g-3">


                <!-- ================================================= -->
                <!-- LISTA DE USUARIOS                                 -->
                <!-- ================================================= -->

                <div class="col-md-4 col-lg-3">

                    <div class="card shadow-sm h-100">

                        <div class="card-header">

                            <strong>
                                Usuarios conectados
                            </strong>

                        </div>

                        <div class="card-body">

                            <!--
                                JavaScript cargará dinámicamente
                                los usuarios que están conectados.
                            -->
                            <ul
                                id="listaUsuarios"
                                class="list-group list-group-flush"
                            >
                            </ul>

                        </div>

                    </div>

                </div>



                <!-- ================================================= -->
                <!-- MENSAJES Y EVENTOS                                -->
                <!-- ================================================= -->

                <div class="col-md-8 col-lg-9">

                    <div class="card shadow-sm">


                        <!--
                            Dentro de este contenedor aparecerán:

                            - mensajes;
                            - ingresos;
                            - desconexiones;
                            - horarios.
                        -->
                        <div
                            id="mensajes"
                            class="card-body chat-mensajes"
                        >

                            <!--
                                Este mensaje desaparece automáticamente
                                cuando ocurre el primer evento.
                            -->
                            <p class="text-secondary text-center mensaje-inicial">
                                Todavía no hay mensajes.
                            </p>

                        </div>



                        <!-- ================================================= -->
                        <!-- FORMULARIO DE MENSAJES                            -->
                        <!-- ================================================= -->

                        <div class="card-footer">

                            <!--
                                Formulario utilizado para enviar
                                mensajes al servidor mediante Socket.IO.
                            -->
                            <form id="formMensaje">

                                <div class="input-group">

                                    <!-- Campo donde se escribe el mensaje -->
                                    <input
                                        type="text"
                                        id="mensaje"
                                        class="form-control"
                                        placeholder="Escribí un mensaje..."
                                        autocomplete="off"
                                        required
                                    >


                                    <!-- Botón de envío -->
                                    <button
                                        type="submit"
                                        class="btn btn-primary"
                                    >
                                        Enviar
                                    </button>

                                </div>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>



    <!--
        Socket.IO entrega automáticamente esta librería
        desde el servidor.

        Gracias a esto podemos utilizar:
        const socket = io();
    -->
    <script src="/socket.io/socket.io.js"></script>


    <!-- JavaScript propio del frontend -->
    <script src="script.js"></script>


    <!-- JavaScript de Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
